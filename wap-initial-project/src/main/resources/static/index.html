<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Asset Management - Front End</title>
  <link rel="stylesheet" href="./css/styles.css">
  <style>.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}</style>
</head>
<body>
  <header class="app-header">
    <h1>Digital Asset Management</h1>
    <div class="header-actions">
      <label for="searchInput" class="visually-hidden">Szukaj zasobów</label>
      <input id="searchInput" type="search" placeholder="Szukaj zasobów..." />
      <button id="refreshBtn">Odśwież</button>
    </div>
  </header>

  <main class="app-main">
    <aside class="sidebar">
      <section class="upload">
        <h2>Prześlij plik</h2>
        <form id="uploadForm">
          <label for="fileInput">Plik</label>
          <input type="file" id="fileInput" name="file" />
          <label for="titleInput">Tytuł</label>
          <input type="text" id="titleInput" name="title" placeholder="Tytuł" />
          <label for="typeSelect">Typ</label>
          <select id="typeSelect" name="type">
            <option value="image">Obraz</option>
            <option value="video">Wideo</option>
            <option value="document">Dokument</option>
          </select>
          <label for="ownerInput">Właściciel (userId)</label>
          <input id="ownerInput" name="ownerId" type="number" placeholder="1" />
          <label for="categorySelect">Kategoria</label>
          <select id="categorySelect" name="categoryId">
            <option value="">Bez kategorii</option>
          </select>
          <fieldset class="tag-picker">
            <legend>Tagi</legend>
            <div id="uploadTagsList" class="checkbox-list"></div>
          </fieldset>
          <button type="submit">Prześlij</button>
        </form>
      </section>

      <section class="filters">
        <h2>Filtry</h2>
        <label>
          <input type="checkbox" id="filterPublished" /> Tylko opublikowane
        </label>
        <h3>Kategorie</h3>
        <form id="categoryForm" class="inline-form">
          <input id="newCategoryName" type="text" placeholder="Nowa kategoria" />
          <button type="submit">Dodaj</button>
        </form>
        <ul id="categoriesList" class="list-reset"></ul>
        <h3>Tagi</h3>
        <form id="tagForm" class="inline-form">
          <input id="newTagName" type="text" placeholder="Nowy tag" />
          <button type="submit">Dodaj</button>
        </form>
        <ul id="tagsList" class="list-reset"></ul>
      </section>
    </aside>

    <section class="content">
      <div class="toolbar">
        <div>Znaleziona liczba: <span id="count">0</span></div>
        <div class="view-toggle">
          <button id="gridView" class="active">Siatka</button>
          <button id="listView">Lista</button>
        </div>
      </div>

      <div id="assets" class="assets grid"></div>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <template id="assetCardTemplate">
    <article class="asset-card">
      <img class="asset-thumb" src="" alt="miniatura"/>
      <div class="asset-info">
        <h4 class="asset-title"></h4>
        <div class="asset-meta"></div>
      </div>
      <div class="asset-actions">
        <button class="viewBtn">Podgląd</button>
        <button class="downloadBtn">Pobierz</button>
      </div>
    </article>
  </template>

  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
